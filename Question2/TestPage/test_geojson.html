<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON 測試頁面（自動生成）</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 500px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .info {
            margin: 20px 0;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info-badge {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        select {
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
            min-width: 300px;
        }
        button {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #007bff;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        pre {
            max-height: 300px;
            overflow: auto;
            background: white;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>🗺️ GeoJSON 檔案測試</h1>
    
    <div class="info">
        <h3>📋 說明</h3>
        <p>這個頁面用於測試轉換後的 GeoJSON 檔案是否能在 HTML 中正常使用。</p>
        <p>本頁面由 Python 腳本自動生成，包含當前目錄下所有的 .geojson 檔案。</p>
    </div>

    <div class="status info-badge">
        <strong>📊 統計：</strong> 找到 3 個 GeoJSON 檔案
    </div>

    <div class="info">
        <h3>🔍 選擇檔案</h3>
        <select id="fileSelect" onchange="loadGeoJSON()">
            <option value="">請選擇檔案</option>
            <option value="10_tn-village.geojson">10_tn-village.geojson (8.14 MB)</option>
            <option value="test_output.geojson">test_output.geojson (3.12 MB)</option>
            <option value="test_output_wgs84.geojson">test_output_wgs84.geojson (3.37 MB)</option>
        </select>
        <button onclick="location.reload()" style="margin-left: 10px;">🔄 重新整理</button>
    </div>

    <div id="status" class="status" style="display: none;"></div>

    <div class="info">
        <h3>🗺️ 地圖顯示</h3>
        <div id="map"></div>
    </div>

    <div class="info">
        <h3>📄 GeoJSON 資訊</h3>
        <div style="margin-bottom: 10px;">
            <strong>Features 數量:</strong> <span id="featureCount">-</span> |
            <strong>坐標系統:</strong> <span id="crsInfo">-</span> |
            <strong>邊界範圍:</strong> <span id="boundsInfo">-</span>
        </div>
        <pre id="geojsonInfo">尚未載入檔案</pre>
    </div>

    <script>
        let map;
        let geojsonLayer;

        // 初始化地圖
        function initMap() {
            map = L.map('map').setView([23.126724, 120.292034], 10);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }

        // 載入 GeoJSON 檔案
        async function loadGeoJSON() {
            const fileSelect = document.getElementById('fileSelect');
            const selectedFile = fileSelect.value;
            
            if (!selectedFile) {
                return;
            }

            const statusDiv = document.getElementById('status');
            const infoDiv = document.getElementById('geojsonInfo');
            const featureCount = document.getElementById('featureCount');
            const crsInfo = document.getElementById('crsInfo');
            const boundsInfo = document.getElementById('boundsInfo');

            try {
                showStatus('⏳ 正在載入 GeoJSON 檔案...', 'status info-badge');
                
                const response = await fetch(selectedFile);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const geojsonData = await response.json();
                
                // 顯示統計資訊
                featureCount.textContent = geojsonData.features ? geojsonData.features.length : 0;
                crsInfo.textContent = geojsonData.crs ? (geojsonData.crs.properties?.name || 'WGS84') : 'WGS84';
                
                // 顯示 GeoJSON 資訊（限制顯示前5000個字符）
                const jsonStr = JSON.stringify(geojsonData, null, 2);
                if (jsonStr.length > 5000) {
                    infoDiv.textContent = jsonStr.substring(0, 5000) + '\n\n... (資料太大，僅顯示前5000字符)';
                } else {
                    infoDiv.textContent = jsonStr;
                }
                
                // 清除舊的圖層
                if (geojsonLayer) {
                    map.removeLayer(geojsonLayer);
                }
                
                // 添加新的 GeoJSON 圖層
                geojsonLayer = L.geoJSON(geojsonData, {
                    style: function(feature) {
                        return {
                            color: '#3388ff',
                            weight: 2,
                            fillColor: '#3388ff',
                            fillOpacity: 0.2
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        // 創建彈出窗口內容
                        let popupContent = '<div style="max-width: 300px;">';
                        popupContent += '<strong>🏷️ 屬性:</strong><br>';
                        
                        if (feature.properties && Object.keys(feature.properties).length > 0) {
                            for (let key in feature.properties) {
                                popupContent += `<strong>${key}:</strong> ${feature.properties[key]}<br>`;
                            }
                        } else {
                            popupContent += '<em>無屬性資料</em>';
                        }
                        
                        popupContent += '</div>';
                        layer.bindPopup(popupContent);
                        
                        // 滑鼠懸停效果
                        layer.on('mouseover', function(e) {
                            layer.setStyle({
                                fillOpacity: 0.5,
                                weight: 3
                            });
                        });
                        
                        layer.on('mouseout', function(e) {
                            layer.setStyle({
                                fillOpacity: 0.2,
                                weight: 2
                            });
                        });
                    }
                }).addTo(map);
                
                // 調整地圖視圖到 GeoJSON 邊界
                if (geojsonData.features && geojsonData.features.length > 0) {
                    const bounds = geojsonLayer.getBounds();
                    map.fitBounds(bounds);
                    
                    // 顯示邊界資訊
                    boundsInfo.textContent = `(${bounds.getSouth().toFixed(4)}, ${bounds.getWest().toFixed(4)}) - (${bounds.getNorth().toFixed(4)}, ${bounds.getEast().toFixed(4)})`;
                }
                
                showStatus(`✅ 成功載入 ${selectedFile}！包含 ${geojsonData.features.length} 個要素`, 'success');
                
            } catch (error) {
                console.error('載入 GeoJSON 失敗:', error);
                showStatus(`❌ 載入失敗: ${error.message}`, 'error');
                infoDiv.textContent = `載入失敗: ${error.message}`;
                featureCount.textContent = '-';
                crsInfo.textContent = '-';
                boundsInfo.textContent = '-';
            }
        }

        // 顯示狀態訊息
        function showStatus(message, className) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + className;
            statusDiv.style.display = 'block';
            
            // 3秒後隱藏狀態訊息（除非是錯誤）
            if (!className.includes('error')) {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            console.log('✅ 地圖初始化完成');
            console.log('📂 可用檔案數:', document.getElementById('fileSelect').options.length - 1);
        });
    </script>
</body>
</html>
