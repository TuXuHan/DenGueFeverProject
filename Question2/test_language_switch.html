<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語言切換測試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .lang-option { display: inline-block; margin: 5px; padding: 10px 15px; background: #f0f0f0; cursor: pointer; border-radius: 5px; }
        .lang-option.active { background: #007bff; color: white; }
        .test-element { margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>語言切換功能測試</h1>
    
    <div class="test-section">
        <h3>語言切換按鈕</h3>
        <div class="lang-option active" data-lang="zh" onclick="switchLanguage('zh')">中文</div>
        <div class="lang-option" data-lang="en" onclick="switchLanguage('en')">English</div>
    </div>
    
    <div class="test-section">
        <h3>可翻譯元素測試</h3>
        <div class="test-element translatable" data-zh="台南市登革熱疫情資料" data-en="Tainan City Dengue Fever Epidemic Data">台南市登革熱疫情資料</div>
        <div class="test-element translatable" data-zh="行政區列表" data-en="District List">行政區列表</div>
        <div class="test-element translatable" data-zh="預測病例" data-en="Predicted Cases">預測病例</div>
    </div>
    
    <div class="test-section">
        <h3>地圖元素模擬</h3>
        <div class="test-element leaflet-marker-icon" aria-label="地圖標記圖標">地圖標記圖標</div>
        <div class="test-element custom-div-icon" aria-label="自定義圖標">自定義圖標</div>
        <div class="test-element village-label" aria-label="村里標籤">村里標籤</div>
        <div class="test-element" id="district-list" aria-label="行政區列表">行政區列表</div>
    </div>
    
    <div class="test-section">
        <h3>當前語言狀態</h3>
        <div id="current-lang">中文</div>
    </div>

    <script>
        // 語言切換功能
        let currentLanguage = 'zh';

        // 翻譯對照表
        const translations = {
            'zh': {
                '台南市登革熱疫情資料': '台南市登革熱疫情資料',
                '行政區列表': '行政區列表',
                '預測病例': '預測病例',
                'district-list': '行政區列表',
                'leaflet-marker-icon': '地圖標記圖標',
                'custom-div-icon': '自定義圖標',
                'leaflet-zoom-animated': '地圖縮放動畫',
                'leaflet-interactive': '地圖互動元素',
                'village-label': '村里標籤'
            },
            'en': {
                '台南市登革熱疫情資料': 'Tainan City Dengue Fever Epidemic Data',
                '行政區列表': 'District List',
                '預測病例': 'Predicted Cases',
                'district-list': 'District List',
                'leaflet-marker-icon': 'Map Marker Icon',
                'custom-div-icon': 'Custom Icon',
                'leaflet-zoom-animated': 'Map Zoom Animation',
                'leaflet-interactive': 'Map Interactive Element',
                'village-label': 'Village Label'
            }
        };

        function updateLanguageElements() {
            // 更新所有可翻譯的元素
            document.querySelectorAll('.translatable').forEach(element => {
                const text = element.textContent.trim();
                if (translations[currentLanguage] && translations[currentLanguage][text]) {
                    element.textContent = translations[currentLanguage][text];
                } else if (element.dataset[currentLanguage]) {
                    element.textContent = element.dataset[currentLanguage];
                }
            });
            
            // 更新CSS類名的aria-label屬性
            const cssClassTranslations = {
                'leaflet-marker-icon': translations[currentLanguage]['leaflet-marker-icon'],
                'custom-div-icon': translations[currentLanguage]['custom-div-icon'],
                'leaflet-zoom-animated': translations[currentLanguage]['leaflet-zoom-animated'],
                'leaflet-interactive': translations[currentLanguage]['leaflet-interactive'],
                'village-label': translations[currentLanguage]['village-label']
            };
            
            // 更新所有相關元素的aria-label
            Object.keys(cssClassTranslations).forEach(className => {
                const elements = document.querySelectorAll(`.${className}`);
                elements.forEach(element => {
                    element.setAttribute('aria-label', cssClassTranslations[className]);
                });
            });
            
            // 更新district-list的aria-label
            const districtList = document.getElementById('district-list');
            if (districtList) {
                districtList.setAttribute('aria-label', translations[currentLanguage]['district-list']);
            }
        }

        function switchLanguage(lang) {
            console.log('切換語言至:', lang);
            
            // 更新全局語言變量
            currentLanguage = lang;
            
            // 更新語言切換按鈕狀態
            document.querySelectorAll('.lang-option').forEach(option => {
                option.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            
            // 更新所有語言相關元素
            updateLanguageElements();
            
            // 更新當前語言顯示
            document.getElementById('current-lang').textContent = lang === 'zh' ? '中文' : 'English';
            
            console.log('語言切換完成:', lang);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('測試頁面已載入');
            updateLanguageElements();
        });
    </script>
</body>
</html>
