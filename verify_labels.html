<!DOCTYPE html>
<html>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .coordinates { font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

                <th>標籤座標 (緯度, 經度)</th>
                <th>邊界範圍</th>

        <tbody id="tableBody">

        districts.forEach((dist, index) => {
            const row = tbody.insertRow();
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${dist.name}</strong></td>
                <td class="coordinates">[${dist.lat.toFixed(5)}, ${dist.lon.toFixed(5)}]</td>

            `;
        });
    </script>

    <h2>如何驗證：</h2>
    <ol>
        <li>打開主地圖頁面 (template/map.html)</li>
        <li>對照上表，檢查每個區域的標籤是否顯示在正確位置</li>
        <li>如果發現錯誤，請記下是哪個區域的標籤顯示在哪個錯誤的區域</li>
        <li>將錯誤資訊告訴我，我會進一步調查和修復</li>
    </ol>
</body>
</html>
